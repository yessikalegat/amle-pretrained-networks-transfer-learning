<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 360" width="960" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Without the trick, every leaf is measured again before each of 30 training sessions: 31,020 lab tests. With the trick, each leaf is measured once and the report is read 30 times: 1,034 lab tests.">
  <defs>
    <symbol id="leaf" viewBox="0 0 40 50">
      <path d="M20 3 C35 12 37 33 20 47 C3 33 5 12 20 3z" fill="#5f9a32"/>
      <path d="M20 9 V44 M20 22 L12 16 M20 22 L28 16 M20 32 L11 26 M20 32 L29 26" stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.8"/>
      <circle cx="13" cy="30" r="2.6" fill="#8a5a2b"/>
      <circle cx="27" cy="20" r="2.2" fill="#8a5a2b"/>
      <circle cx="25" cy="35" r="1.8" fill="#8a5a2b"/>
    </symbol>
    <symbol id="syringe-red" viewBox="0 0 44 14">
      <rect x="9" y="3" width="24" height="8" rx="1.5" fill="none" stroke="#cf4a45" stroke-width="2"/>
      <path d="M1 7 H9 M3 3 V11 M33 7 H43" stroke="#cf4a45" stroke-width="2"/>
      <rect x="11" y="5" width="12" height="4" fill="#cf4a45" opacity="0.6"/>
    </symbol>
    <symbol id="syringe-green" viewBox="0 0 44 14">
      <rect x="9" y="3" width="24" height="8" rx="1.5" fill="none" stroke="#2e8a6e" stroke-width="2"/>
      <path d="M1 7 H9 M3 3 V11 M33 7 H43" stroke="#2e8a6e" stroke-width="2"/>
      <rect x="11" y="5" width="12" height="4" fill="#2e8a6e" opacity="0.6"/>
    </symbol>
    <symbol id="report" viewBox="0 0 36 46">
      <rect x="1.5" y="1.5" width="33" height="43" rx="3" fill="#ffffff" stroke="#2e8a6e" stroke-width="2"/>
      <path d="M8 11H28M8 17H28M8 23H22M8 29H28M8 35H25M8 40H18" stroke="#2e8a6e" stroke-width="2" opacity="0.55"/>
    </symbol>
    <symbol id="doctor" viewBox="0 0 60 90">
      <circle cx="30" cy="18" r="14" fill="#1d2a1f"/>
      <path d="M5 90 V60 a25 25 0 0 1 50 0 V90z" fill="#ffffff" stroke="#1d2a1f" stroke-width="2.5"/>
      <path d="M30 36 V90" stroke="#1d2a1f" stroke-width="2"/>
      <path d="M20 38 C16 54 22 62 30 62 C38 62 44 54 40 38" fill="none" stroke="#1d2a1f" stroke-width="2"/>
      <circle cx="30" cy="64" r="3.5" fill="#1d2a1f"/>
    </symbol>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d6b5f"/></marker>
  </defs>

  <rect width="960" height="360" fill="#ffffff"/>

  <!-- without the trick -->
  <rect x="20" y="20" width="450" height="220" rx="10" fill="#fbe6e4" stroke="#cf4a45" stroke-width="1.5"/>
  <text x="40" y="52" font-size="20" font-weight="700" fill="#cf4a45">✗ Without the trick</text>
  <use href="#leaf" xlink:href="#leaf" x="40" y="70" width="64" height="80"/>
  <g>
    <use href="#syringe-red" xlink:href="#syringe-red" x="130" y="70" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="180" y="70" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="230" y="70" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="280" y="70" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="330" y="70" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="380" y="70" width="44" height="14"/>
    <use href="#syringe-red" xlink:href="#syringe-red" x="130" y="92" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="180" y="92" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="230" y="92" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="280" y="92" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="330" y="92" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="380" y="92" width="44" height="14"/>
    <use href="#syringe-red" xlink:href="#syringe-red" x="130" y="114" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="180" y="114" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="230" y="114" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="280" y="114" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="330" y="114" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="380" y="114" width="44" height="14"/>
    <use href="#syringe-red" xlink:href="#syringe-red" x="130" y="136" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="180" y="136" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="230" y="136" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="280" y="136" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="330" y="136" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="380" y="136" width="44" height="14"/>
    <use href="#syringe-red" xlink:href="#syringe-red" x="130" y="158" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="180" y="158" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="230" y="158" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="280" y="158" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="330" y="158" width="44" height="14"/><use href="#syringe-red" xlink:href="#syringe-red" x="380" y="158" width="44" height="14"/>
  </g>
  <text x="40" y="202" font-size="13" fill="#1d2a1f">Measure again before each of the 30 study sessions:</text>
  <text x="40" y="222" font-size="13" font-weight="700" fill="#cf4a45">30 × 1,034 = 31,020 lab tests, always the same result</text>

  <!-- with the trick -->
  <rect x="490" y="20" width="450" height="220" rx="10" fill="#e0f2ec" stroke="#2e8a6e" stroke-width="1.5"/>
  <text x="510" y="52" font-size="20" font-weight="700" fill="#2e8a6e">✓ With the trick</text>
  <use href="#leaf" xlink:href="#leaf" x="510" y="70" width="64" height="80"/>
  <use href="#syringe-green" xlink:href="#syringe-green" x="584" y="104" width="44" height="14"/>
  <path d="M632 111 H652" stroke="#5d6b5f" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <use href="#report" xlink:href="#report" x="658" y="72" width="60" height="78"/>
  <path d="M722 111 H748" stroke="#5d6b5f" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <use href="#doctor" xlink:href="#doctor" x="754" y="62" width="62" height="94"/>
  <rect x="826" y="88" width="98" height="40" rx="20" fill="#ffffff" stroke="#2e8a6e" stroke-width="1.5"/>
  <text x="875" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#2e8a6e">read 30 ×</text>
  <text x="510" y="202" font-size="13" fill="#1d2a1f">Measure once, then only read the report:</text>
  <text x="510" y="222" font-size="13" font-weight="700" fill="#2e8a6e">1 × 1,034 = 1,034 lab tests</text>

  <!-- bars, to scale -->
  <text x="20" y="284" font-size="13" fill="#1d2a1f">without the trick</text>
  <rect x="140" y="268" width="700" height="22" rx="4" fill="#e8a19e"/>
  <text x="850" y="285" font-size="14" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#cf4a45">31,020</text>
  <text x="20" y="324" font-size="13" fill="#1d2a1f">with the trick</text>
  <rect x="140" y="308" width="23" height="22" rx="4" fill="#2e8a6e"/>
  <text x="173" y="325" font-size="14" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#2e8a6e">1,034</text>
  <text x="140" y="352" font-size="12" fill="#5d6b5f">Passes through the base, to scale: 30 times fewer</text>
</svg>
